name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install build twine

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(
            python -c \
              'from saturni_rag import __version__; print(__version__)'
          )"

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Package version: $PACKAGE_VERSION"
          echo "Tag version:     $TAG_VERSION"

          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag and package versions do not match."
            exit 1
          fi

      - name: Verify changelog entry
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Build distributions
        run: |
          rm -rf build dist
          python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Test built wheel
        run: |
          python -m venv /tmp/saturni-release-test
          /tmp/saturni-release-test/bin/python \
            -m pip install dist/*.whl
          /tmp/saturni-release-test/bin/saturni --version

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS.txt \
            --title "Saturni RAG $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
